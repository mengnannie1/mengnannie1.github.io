<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人主页与作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Great+Vibes&family=Bilbo+Swash+Caps&family=Archivo+Narrow:wght@700&family=Antonio:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: 左对齐的编辑式目录页。巨大的名字开场，作品像编号索引卡，其余内容保持安静。 */
:root{
  --bg:#f3f3ee;
  --surface:#fbfbf8;
  --ink:#15171c;
  --muted:#5f6470;
  --line:#d9d9d0;
  --accent:#2a3cff;
  --accent-ink:#ffffff;
  --font-display:"Bricolage Grotesque","Noto Sans SC",system-ui,sans-serif;
  --font-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101218;--surface:#171a22;--ink:#eceae3;--muted:#9a9eab;--line:#2a2e39;--accent:#8794ff;--accent-ink:#0d0f18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101218;--surface:#171a22;--ink:#eceae3;--muted:#9a9eab;--line:#2a2e39;--accent:#8794ff;--accent-ink:#0d0f18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.1}

/* nav */
header.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:16px}
.brand{font-family:var(--font-display);font-weight:800;text-decoration:none;font-size:18px}
.nav nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.nav nav a{text-decoration:none;font-size:14px;color:var(--muted)}
.nav nav a:hover{color:var(--ink)}
.themebtn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:14px}

/* hero */
.hero{padding:72px 0 56px;border-bottom:1px solid var(--line)}
.hero .mono{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.hero h1{font-size:clamp(52px,12vw,148px);font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{max-width:34em;font-size:clamp(17px,2.2vw,21px);margin:28px 0 0;color:var(--ink)}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-block;padding:10px 20px;border-radius:999px;border:1px solid var(--ink);text-decoration:none;font-size:15px;font-weight:500;cursor:pointer;background:transparent;color:var(--ink);font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{transform:translateY(-1px)}


/* hero cover */
.hero{padding:0;border-bottom:1px solid var(--line)}
.hero .stage{position:relative;overflow:hidden;height:calc(100vh - 58px);height:calc(100dvh - 58px);min-height:420px;width:100%;background:#8f93a6;--px:0;--py:0;--rise:-900px;--fs:clamp(56px,10vw,180px);isolation:isolate}
.hero .sea{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 56%}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(30,34,60,0) 28%,rgba(30,34,60,.34) 100%)}
.hero .layer{position:absolute;inset:0;pointer-events:none;transition:transform .5s ease-out}
.hero .px-s{transform:translate3d(calc(var(--px)*-8px),calc(var(--py)*-6px),0)}
.hero .px-b{transform:translate3d(calc(var(--px)*-14px),calc(var(--py)*-10px),0)}
.hero .px-p{transform:translate3d(calc(var(--px)*6px),calc(var(--py)*4px),0)}
.hero .px-f{transform:translate3d(calc(var(--px)*18px),calc(var(--py)*12px),0)}
.hero .person{position:absolute;left:4%;bottom:-6px;height:94%;width:auto;filter:drop-shadow(10px 12px 18px rgba(30,60,90,.3));animation:bob 7s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes bob{from{transform:translateY(0) rotate(-.4deg)}to{transform:translateY(-10px) rotate(.5deg)}}
.hero .fl{position:absolute;width:var(--w);left:var(--l);top:var(--t);opacity:.9;animation:flo var(--d) ease-in-out var(--dl) infinite alternate;filter:drop-shadow(0 3px 6px rgba(200,90,150,.25))}
@keyframes flo{from{transform:translateY(-6px) rotate(var(--r))}to{transform:translateY(8px) rotate(calc(var(--r) + 14deg))}}
.hero .sea-life{position:absolute;height:auto;animation:drift 6s ease-in-out infinite alternate;filter:drop-shadow(0 8px 12px rgba(30,70,110,.25))}
.hero .horse{left:1.2%;top:4%;width:clamp(56px,6vw,100px);--rot:-6deg}
.hero .shell{right:2.5%;bottom:3%;width:clamp(90px,12vw,200px);--rot:-8deg;animation-duration:8s}
.hero .snail{left:auto;right:5%;bottom:calc(3% + 9.6vw);width:clamp(60px,7.4vw,120px);--rot:10deg;animation-duration:9s;animation-delay:-3s}
@keyframes drift{from{transform:translateY(-6px) rotate(calc(var(--rot) - 3deg))}to{transform:translateY(8px) rotate(calc(var(--rot) + 3deg))}}
.hero .swirl{position:absolute;width:clamp(150px,19vw,300px);height:auto;filter:saturate(2) contrast(1.2) drop-shadow(0 0 3px rgba(140,80,170,.7)) drop-shadow(0 0 10px rgba(255,255,255,.7));animation:shimmer 3.6s ease-in-out infinite}
.hero .s-tr{top:-2%;right:3%;transform:rotate(18deg)}
.hero .s-br{bottom:-4%;right:-1%;transform:rotate(200deg) scaleX(-1);animation-delay:-1.4s}
.hero .s-tl{top:-3%;left:-3%;width:clamp(120px,15vw,230px);transform:rotate(-24deg) scaleX(-1);animation-delay:-2.6s}
@keyframes shimmer{0%,100%{opacity:.85;filter:saturate(2) contrast(1.2) drop-shadow(0 0 3px rgba(140,80,170,.7)) drop-shadow(0 0 8px rgba(255,255,255,.5))}50%{opacity:1;filter:saturate(2.2) contrast(1.3) brightness(1.15) drop-shadow(0 0 4px rgba(140,80,170,.8)) drop-shadow(0 0 16px rgba(255,255,255,.95))}}
.hero .tw{position:absolute;width:14px;height:14px;background:radial-gradient(circle,#fff 0,rgba(255,255,255,0) 70%);animation:tw 2.4s ease-in-out infinite;pointer-events:none}
.hero .tw::before,.hero .tw::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}
.hero .tw::before{width:2px;height:22px}.hero .tw::after{width:22px;height:2px}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.hero .b{position:absolute;bottom:0;left:var(--x);width:var(--s);height:var(--s);animation:rise var(--d) linear var(--dl) infinite;will-change:transform,opacity;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hero .b i{display:block;width:100%;height:100%;background:var(--img) center/contain no-repeat;animation:sway var(--sw) ease-in-out var(--dl) infinite alternate;opacity:var(--o)}
@keyframes rise{0%{transform:translate3d(0,120%,0);opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:translate3d(0,var(--rise),0);opacity:0}}
@keyframes sway{from{transform:translateX(-18px) scale(1)}to{transform:translateX(18px) scale(1.06)}}
.hero .b.pop{animation-play-state:paused;pointer-events:none}
.hero .b.pop i{animation:popb .28s ease-out forwards}
@keyframes popb{0%{transform:scale(1);opacity:1}60%{transform:scale(1.28);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.hero .drop{position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(190,225,255,.75));pointer-events:none;z-index:7;animation:drop .6s ease-out forwards}
@keyframes drop{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.hero .ring{position:absolute;border:2px solid rgba(255,255,255,.9);border-radius:50%;pointer-events:none;z-index:7;animation:ring .5s ease-out forwards}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.6);opacity:0}}
.hero .copy{position:absolute;z-index:6;left:41%;right:14%;top:0;bottom:0;display:flex;flex-direction:column;pointer-events:none}
.hero .above{height:56%;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start}
.hero .below{padding-top:calc(var(--fs)*.78 + 6px)}
.hero .below>*{pointer-events:auto}
.hero .copy .mono{color:#fff;margin-bottom:clamp(2px,1vw,14px);font-weight:500;letter-spacing:.04em;text-shadow:0 1px 10px rgba(20,24,50,.6);pointer-events:auto}
.hero .word{position:relative;display:block;border:0;background:none;padding:0 .04em;margin:0;cursor:pointer;pointer-events:auto;font-family:'Antonio','Oswald','Noto Sans SC',sans-serif;font-weight:400;font-size:var(--fs);line-height:.86;letter-spacing:.01em;text-transform:lowercase;color:#fff;transform-origin:0 100%;transition:transform .38s cubic-bezier(.34,1.56,.64,1),filter .3s;-webkit-tap-highlight-color:transparent}
.hero .word .w,.hero .word .r{display:block;white-space:nowrap;-webkit-text-stroke:max(2px,.022em) #f2a6d6;paint-order:stroke fill;text-shadow:0 0 .12em rgba(255,180,225,.55)}
.hero .word .r{position:absolute;left:.04em;top:100%;transform:scaleY(-1);transform-origin:50% 50%;opacity:.42;-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,0) 78%);mask-image:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,0) 78%);filter:blur(.6px);animation:ripple 3.4s ease-in-out infinite alternate;pointer-events:none}
@keyframes ripple{from{transform:scaleY(-1) translateX(-2px)}to{transform:scaleY(-1) translateX(3px)}}
.hero .word:hover,.hero .word:focus-visible{transform:scale(1.14);filter:drop-shadow(0 6px 18px rgba(240,140,200,.55));outline:none}
.hero .word:active{transform:scale(1.06)}
.hero .word .hint{position:absolute;left:100%;top:6%;margin-left:14px;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.04em;color:#1d2140;background:rgba(255,255,255,.9);border-radius:999px;padding:6px 12px;-webkit-text-stroke:0;text-shadow:none;opacity:0;transform:translateX(-6px);transition:opacity .25s,transform .25s;pointer-events:none}
.hero .word:hover .hint,.hero .word:focus-visible .hint{opacity:1;transform:none}
@media (hover:none){.hero .word .hint{opacity:1;transform:none;left:auto;right:0;top:-1.6em;margin:0;font-size:12px}}
.hero .copy h1{font-size:clamp(22px,2.7vw,40px);margin:0;color:#fff;text-shadow:0 1px 14px rgba(20,24,50,.55)}
.hero .copy h1 em{color:#ffd0ea}
.hero .copy .lead{color:#fff;font-size:clamp(14px,1.3vw,17px);margin-top:12px;max-width:34em;text-shadow:0 1px 12px rgba(20,24,50,.6)}
.hero .copy .cta{margin-top:18px}
.hero .copy .btn{color:#fff;border-color:#fff;background:rgba(255,255,255,.14);backdrop-filter:blur(4px)}
.hero .copy .btn.primary{background:#fff;color:#1d2140;border-color:#fff}
.overlay.about-pop{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);padding:0;overflow:auto;align-items:flex-start;justify-content:center}
.overlay.about-pop.open{display:block}
.about-pop .modal{max-width:1000px;width:100%;margin:0 auto;border:0;border-radius:0;max-height:none;overflow:visible;position:relative;min-height:100%}
.about-pop .adeco{position:absolute;pointer-events:none}
.about-pop .adeco.f1{width:220px;left:0;bottom:0;transform:rotate(-8deg) scaleX(-1);opacity:.7}
.about-pop .adeco.sh{width:120px;right:28px;bottom:24px;transform:rotate(-10deg);opacity:.9}
.about-pop .close{position:absolute;top:18px;right:20px;float:none;margin:0;z-index:5;background:var(--bg)}
.about-pop .inner{padding:72px 32px 56px;position:relative}
.about-pop .awhead{font-family:'Antonio','Noto Sans SC',sans-serif;font-weight:400;font-size:clamp(56px,10vw,120px);line-height:.9;color:#fff;-webkit-text-stroke:3px #e58cc5;paint-order:stroke fill;text-transform:lowercase;margin:0 0 28px;text-shadow:0 0 14px rgba(255,180,225,.55)}
@media (max-width:760px){
  .hero .stage{--fs:clamp(52px,17vw,90px)}
  .hero .copy{left:5%;right:5%}
  .hero .sea{object-position:50% 50%}
  .hero .copy h1,.hero .copy .lead{display:none}
  .hero .copy .cta{position:absolute;right:0;bottom:6%;flex-direction:column;align-items:stretch;margin:0}
  .hero .person{left:-6%;height:40%}
  .hero .s-br,.hero .s-tl{display:none}
  .hero .horse{top:4%;left:2%;width:52px}
  .hero .shell{right:3%;bottom:5%;width:96px}
  .hero .snail{bottom:calc(5% + 78px);right:7%;width:66px}
  .hero .word .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  .hero .person,.hero .swirl,.hero .b,.hero .b i,.hero .fl,.hero .sea-life,.hero .tw,.hero .word .r{animation:none!important}
  .hero .b{bottom:auto;top:calc(var(--y)*1%)}
  .hero .layer{transition:none}
}

.hero .person.hot{filter:drop-shadow(10px 12px 18px rgba(30,60,90,.3)) drop-shadow(0 0 14px rgba(255,200,235,.9)) brightness(1.04)}
.hero .person-hint{position:absolute;z-index:6;left:20%;top:12%;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.04em;color:#1d2140;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s;pointer-events:none}
.hero .stage.hot-person .person-hint{opacity:1;transform:none}
.hero .stage.hot-person{cursor:pointer}
.overlay.about-pop.contact{background:#eef4fb}
.about-pop.contact .modal{background:none;max-width:none;margin:0;min-height:100%;display:flex;justify-content:center;align-items:center}
.about-pop.contact .chead{position:absolute;left:6vw;top:96px;z-index:2}
.about-pop.contact .mono{display:block;margin-bottom:14px;color:#4a6d92;letter-spacing:.14em}
.about-pop.contact h2{font-family:'Noto Serif SC','Songti SC',serif;font-weight:300;font-size:clamp(40px,5.6vw,84px);white-space:nowrap;letter-spacing:.04em;line-height:1.1;margin:0;color:#4a6d92}
.about-pop.contact .lace{position:relative;container-type:inline-size;width:min(112vw,calc(min(106vh,1060px)*.5627));aspect-ratio:736/1308;flex:none}
.about-pop.contact .lace>img{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;pointer-events:none}
.about-pop.contact .links{position:absolute;left:21%;right:19%;top:25%;bottom:21%;display:flex;flex-direction:column;justify-content:space-evenly;margin:0}
.about-pop.contact .row{display:flex;flex-direction:column;align-items:center;gap:1.4cqw;padding:0;font-family:'Noto Serif SC','Songti SC',serif;font-weight:300;color:#3d5f86;text-decoration:none;text-align:center}
.about-pop.contact .row b{font-weight:300;font-size:4cqw;letter-spacing:.3em;padding-left:.3em}
.about-pop.contact .row i{font-style:normal;font-size:5cqw;letter-spacing:.05em;overflow-wrap:anywhere}
.about-pop.contact .row+.row{border-top:1px solid rgba(74,109,146,.3);padding-top:0}
.about-pop.contact a.row:hover{color:#1f3f66}
.about-pop.contact .close{background:rgba(255,255,255,.85);z-index:5}
@media (max-width:760px){.about-pop.contact .chead{left:20px;top:84px}}
@media (hover:none){.hero .person-hint{opacity:1;left:34%;top:auto;bottom:4%}}

.hero .shell{pointer-events:auto;display:block;cursor:pointer;z-index:3}
.hero .shell img{display:block;width:100%;height:auto;transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .3s}
.hero .shell:hover img,.hero .shell:focus-visible img{transform:scale(1.12);filter:drop-shadow(0 0 14px rgba(255,255,255,.85))}
.hero .shell:focus-visible{outline:none}
.hero .shell-hint{position:absolute;right:50%;transform:translateX(50%) translateY(4px);top:-34px;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.04em;color:#1d2140;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.hero .shell:hover .shell-hint,.hero .shell:focus-visible .shell-hint{opacity:1;transform:translateX(50%)}
@media (hover:none){.hero .shell-hint{opacity:1;transform:translateX(50%)}}

html,body{height:100%;overflow:hidden}
.hero .snail{pointer-events:auto;display:block;cursor:pointer;z-index:3}
.hero .snail img{display:block;width:100%;height:auto;transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .3s}
.hero .snail:hover img,.hero .snail:focus-visible img{transform:scale(1.14);filter:drop-shadow(0 0 14px rgba(255,255,255,.85))}
.hero .snail:focus-visible{outline:none}
.hero .snail:hover .shell-hint,.hero .snail:focus-visible .shell-hint{opacity:1;transform:translateX(50%)}
#overlay{z-index:70}
.overlay.about-pop.page{background:var(--bg)}
.about-pop.page .modal{max-width:1100px;margin:0 auto;display:block;position:relative}
.about-pop.page .pagebar{position:sticky;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.about-pop.page .pagebar .close{position:static;float:none;margin:0;background:var(--bg)}
.about-pop.page section{border-bottom:0}
@media (max-width:760px){
  header.nav .brand{font-size:14px;white-space:nowrap}
  header.nav nav{gap:10px!important}
  header.nav nav a{font-size:13px;white-space:nowrap;margin-left:0}
}
@keyframes beckon{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,255,255,0))}50%{transform:scale(1.07);filter:drop-shadow(0 0 16px rgba(255,255,255,.85))}}
.hero .shell img,.hero .snail img{animation:beckon 2.6s ease-in-out infinite}
.hero .snail img{animation-delay:-1.3s}
.hero .shell:hover img,.hero .shell:focus-visible img,.hero .snail:hover img,.hero .snail:focus-visible img{animation:none;transform:scale(1.16);filter:drop-shadow(0 0 20px rgba(255,255,255,.95))}
.hero .shell .shell-hint,.hero .snail .shell-hint{opacity:1;transform:translateX(50%);font-size:14px;padding:7px 14px;top:-40px;box-shadow:0 2px 12px rgba(20,24,50,.25)}
@media (min-width:761px){
  .hero .shell{right:2.5%;bottom:2.5%;width:clamp(120px,15.5vw,270px)}
  .hero .snail{right:4.5%;bottom:58%;width:clamp(84px,10.5vw,180px)}
}
@media (max-width:760px){
  .hero .shell{right:3%;bottom:4%;width:132px}
  .hero .snail{right:6%;bottom:60%;width:92px}
}
@media (prefers-reduced-motion:reduce){.hero .shell img,.hero .snail img{animation:none!important}}
/* v: no labels, smaller shell/snail side by side, glowing portrait */
.hero .shell-hint,.hero .person-hint{display:none!important}
@keyframes edge{0%,100%{filter:drop-shadow(0 0 3px rgba(255,255,255,.45)) drop-shadow(0 0 0 rgba(255,255,255,0))}50%{filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 16px rgba(255,255,255,.55))}}
.hero .shell img,.hero .snail img{animation:edge 2.8s ease-in-out infinite}
.hero .snail img{animation-delay:-1.4s}
.hero .shell:hover img,.hero .shell:focus-visible img,.hero .snail:hover img,.hero .snail:focus-visible img{animation:none;transform:scale(1.12);filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 22px rgba(255,255,255,.9))}
@keyframes pglow{0%,100%{filter:drop-shadow(10px 12px 18px rgba(30,60,90,.3)) drop-shadow(0 0 3px rgba(255,255,255,.5)) drop-shadow(0 0 8px rgba(255,220,240,.25))}50%{filter:drop-shadow(10px 12px 18px rgba(30,60,90,.3)) drop-shadow(0 0 5px rgba(255,255,255,.85)) drop-shadow(0 0 18px rgba(255,215,238,.6))}}
.hero .person{animation:bob 7s ease-in-out infinite alternate,pglow 3.6s ease-in-out infinite}
.hero .person.hot{animation:bob 7s ease-in-out infinite alternate,pglow 1.4s ease-in-out infinite;filter:none}
.hero .copy .lead{max-width:min(26em,100%)}
@media (min-width:761px){
  .hero .shell{right:2.5%;bottom:3%;width:clamp(100px,12.5vw,220px)}
  .hero .snail{right:calc(2.5% + 12.5vw + 2vw);bottom:4.5%;width:clamp(70px,8.6vw,150px)}
}

    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      const n=Math.floor(ac.sampleRate*0.07), buf=ac.createBuffer(1,n,ac.sampleRate), da=buf.getChannelData(0);

      }

(function(){

  let cv=null,ctx=null;
  function prep(){ try{ cv=document.createElement('canvas'); cv.width=img.naturalWidth; cv.height=img.naturalHeight; ctx=cv.getContext('2d',{willReadFrequently:true}); ctx.drawImage(img,0,0); ctx.getImageData(0,0,1,1); }catch(e){ ctx=null; } }
  if(img.complete&&img.naturalWidth) prep(); else img.addEventListener('load',prep);
  function hit(e){
    const t=e.target; if(t.closest&&t.closest('.b,.copy,.person-hint,.sea-life')) return false;
    const hb=document.getElementById('eggBtn'); if(hb){const q=hb.getBoundingClientRect(); if(e.clientX>=q.left&&e.clientX<=q.right&&e.clientY>=q.top&&e.clientY<=q.bottom) return false;}

    try{ const x=Math.floor((e.clientX-r.left)/r.width*cv.width), y=Math.floor((e.clientY-r.top)/r.height*cv.height); return ctx.getImageData(x,y,1,1).data[3]>40; }catch(err){ return true; }

})();

  let sac=null, sWave=null;
  function actx(){ try{ sac=sac||new (window.AudioContext||window.webkitAudioContext)(); if(sac.state==='suspended') sac.resume(); }catch(e){} return sac; }
  function noiseBuf(a){ const n=a.sampleRate*3, b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0); let l=0; for(let i=0;i<n;i++){ const w=Math.random()*2-1; l=(l+.04*w)/1.04; d[i]=l*9; } return b; }
  function waveStart(){
    const a=actx(); if(!a||reduce) return; waveStop(true);
    const t=a.currentTime, D=DUR/1000;
    const src=a.createBufferSource(); src.buffer=noiseBuf(a); src.loop=true;
    const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.7;
    bp.frequency.setValueAtTime(500,t); bp.frequency.linearRampToValueAtTime(1500,t+D*.35); bp.frequency.linearRampToValueAtTime(380,t+D);
    const swell=a.createGain(); swell.gain.value=.55;
    const lfo=a.createOscillator(); lfo.frequency.value=.32; const lg=a.createGain(); lg.gain.value=.4; lfo.connect(lg).connect(swell.gain);
    const env=a.createGain(); env.gain.setValueAtTime(0,t); env.gain.linearRampToValueAtTime(.5,t+1.2); env.gain.setValueAtTime(.5,t+D*.55); env.gain.linearRampToValueAtTime(.0001,t+D+1.2);
    src.connect(bp).connect(swell).connect(env).connect(a.destination);
    src.start(t); lfo.start(t); src.stop(t+D+1.4); lfo.stop(t+D+1.4);
    sWave={env,src,lfo};
  }
  function waveStop(quick){
    if(!sWave||!sac) return; const t=sac.currentTime, w=sWave; sWave=null;
    try{ w.env.gain.cancelScheduledValues(t); w.env.gain.setValueAtTime(w.env.gain.value,t); w.env.gain.linearRampToValueAtTime(.0001,t+(quick?.05:.5)); w.src.stop(t+.6); w.lfo.stop(t+.6); }catch(e){}
  }
  function tone(a,f,t0,dur,vol,type,f2){
    const o=a.createOscillator(), g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur*.6);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.008); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+.05);
  }
  function gemSfx(i){
    const a=actx(); if(!a) return; const t=a.currentTime;
    switch(i){
      case 0: tone(a,1568,t,.9,.14); tone(a,2093,t+.09,.9,.1); tone(a,2637,t+.18,1,.07); break;          /* star: sparkle */
      case 1: tone(a,880,t,.55,.2,'triangle'); tone(a,1760,t,.3,.06); break;                              /* flower: soft pluck */
      case 2: tone(a,420,t,.16,.22,'sine',1100); tone(a,900,t+.14,.1,.08,'sine',1500); break;             /* pearl: bubble */
      case 3: tone(a,1318,t,1.1,.13); tone(a,1976,t,1.1,.08); tone(a,3951,t,.5,.03); break;               /* star: glass ding */
      case 4: tone(a,523,t,.28,.22,'sine',470); tone(a,392,t+.12,.4,.16,'sine',350); break;               /* shell: hollow tok */
      default:{                                                                                           /* conch: low horn */
        const o=a.createOscillator(), g=a.createGain(), v=a.createOscillator(), vg=a.createGain();
        o.type='triangle'; o.frequency.value=233; v.frequency.value=5; vg.gain.value=4; v.connect(vg).connect(o.frequency);
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.2,t+.12); g.gain.exponentialRampToValueAtTime(.0001,t+1.5);
        o.connect(g).connect(a.destination); o.start(t); v.start(t); o.stop(t+1.6); v.stop(t+1.6);
      }
    }
  }
  function openBeach(){
    wresize(); ws=0; card.classList.remove('open');
    gemEls.forEach(g=>g.classList.remove('show')); beach.classList.remove('done');
    beach.classList.add('open'); beach.setAttribute('aria-hidden','false'); waveStart();
    cancelAnimationFrame(wraf);
    if(reduce){ wx.clearRect(0,0,WW,WH); gemEls.forEach(g=>g.classList.add('show')); beach.classList.add('done'); }
    else wraf=requestAnimationFrame(wframe);
  }
  function closeBeach(){ waveStop(); beach.classList.remove('open'); beach.setAttribute('aria-hidden','true'); card.classList.remove('open'); setTimeout(()=>{ if(!beach.classList.contains('open')) cancelAnimationFrame(wraf); },700); btn.focus({preventScroll:true}); }
  beach.addEventListener('click',closeBeach);
  document.getElementById('beachX').addEventListener('click',e=>{e.stopPropagation();closeBeach();});
  btn.addEventListener('click',e=>{e.stopPropagation(); if(done()) openBeach();});
  btn.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&done()){e.preventDefault();openBeach();} });
  document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(card.classList.contains('open')) card.classList.remove('open'); else if(beach.classList.contains('open')) closeBeach(); else if(egg.classList.contains('open')) close(); });
  addEventListener('resize',()=>{ if(egg.classList.contains('open')) resize(); if(beach.classList.contains('open')) wresize(); });
})();

/* sparkle stars: click for glow + chime */
(function(){
  const poster=document.querySelector('.pk-poster'); if(!poster) return;
  let ac=null;
  const C=1046.5,D=1174.66,E=1318.51,F=1396.91,G=1567.98,A=1760;
  const notes=[C,C,G,G,A,A,G,F,F,E,E,D,D,C];
  function chime(f){
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      const t=ac.currentTime;
      [[f,.16,1.1],[f*2,.07,.8],[f*3.01,.03,.5]].forEach(([fr,v,d])=>{
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='sine';o.frequency.value=fr;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
        o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05);
      });
    }catch(e){}
  }
  function burst(star){
    const pr=poster.getBoundingClientRect(), r=star.getBoundingClientRect();
    const cx=r.left+r.width/2-pr.left, cy=r.top+r.height/2-pr.top;
    const b=document.createElement('div'); b.className='star-burst';
    b.style.left=cx+'px'; b.style.top=cy+'px'; b.style.setProperty('--d',Math.max(r.width,28)+'px');
    for(let i=0;i<8;i++){const s=document.createElement('i');s.style.setProperty('--a',(i*45+Math.random()*20)+'deg');s.style.setProperty('--l',(.9+Math.random()*.7)+'');b.appendChild(s);}
    poster.appendChild(b); setTimeout(()=>b.remove(),900);
    star.classList.remove('zap'); void star.offsetWidth; star.classList.add('zap');
  }
  let n=0;
  poster.querySelectorAll('.pk-st.sv').forEach((st,i)=>{
    st.style.pointerEvents='auto'; st.style.cursor='pointer';
    st.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();burst(st);chime(notes[n++%notes.length]);});
  });
})();

/* four entrances: click sound + vibration, fired on press for instant feedback */
(function(){
  const els=document.querySelectorAll('.rf-pol,#aboutBtn,.rf-patch'); if(!els.length) return;
  const base=new Audio('media/click.mp3'); base.preload='auto'; base.load();
  function fb(){
    try{ const a=base.cloneNode(); a.volume=.75; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
    try{ if(navigator.vibrate) navigator.vibrate(18); }catch(e){}
  }
  els.forEach(el=>{
    el.addEventListener('pointerdown',e=>{ if(e.button===0||e.pointerType!=='mouse'){ fb(); el.classList.add('pressed'); } });
    ['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,()=>el.classList.remove('pressed')));
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') fb(); });
  });
})();

/* keycap sound for back / close buttons */
(function(){
  var ctx=null;
  function tick(){
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended')ctx.resume();
      var t=ctx.currentTime;
      /* short noise click */
      var len=Math.floor(ctx.sampleRate*.014),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
      for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);
      var n=ctx.createBufferSource();n.buffer=buf;
      var hp=ctx.createBiquadFilter();hp.type='bandpass';hp.frequency.value=5200;hp.Q.value=1.4;
      var ng=ctx.createGain();ng.gain.value=.9;
      n.connect(hp);hp.connect(ng);ng.connect(ctx.destination);n.start(t);
      /* low thock */
      var o=ctx.createOscillator(),og=ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(260,t+.025);
      og.gain.setValueAtTime(.22,t);og.gain.exponentialRampToValueAtTime(.001,t+.035);
      o.connect(og);og.connect(ctx.destination);o.start(t);o.stop(t+.04);
    }catch(e){}
  }
  document.addEventListener('pointerdown',function(e){
    var b=e.target.closest&&e.target.closest('.btn.close,#overlay .btn.primary');
    if(!b)return;
    tick();
    try{if(navigator.vibrate)navigator.vibrate(10);}catch(_){}
  },true);
  document.addEventListener('keydown',function(e){
    if((e.key==='Enter'||e.key===' ')&&document.activeElement&&document.activeElement.matches&&document.activeElement.matches('.btn.close'))tick();
  },true);
})();
